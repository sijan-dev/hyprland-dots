# BACKGROUND
background {
    monitor =
    path = {{ image }}
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    inner_color = rgba({{ colors.surface_container.default.hex_stripped }}cc)
    font_color = rgba({{ colors.primary.default.hex_stripped }}ff)
    fade_on_empty = true
    fade_timeout = 1500
    font_family = Space Grotesk Medium
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    rounding = 10
    position = 0, -80
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba({{ colors.on_background.default.hex_stripped }}ff)
    font_size = 90
    font_family = Space Grotesk Bold
    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%b %d")</span>"
    color = rgba({{ colors.on_surface_variant.default.hex_stripped }}ff)
    font_size = 26
    font_family = Space Grotesk Medium
    position = 0, 115
    halign = center
    valign = center
}

animations {
    enabled = true
}
